name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradle Wrapper
        run: |
          curl -L -o gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          chmod +x gradlew
          mkdir -p gradle/wrapper
          mv gradle-wrapper.jar gradle/wrapper/
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: locker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
